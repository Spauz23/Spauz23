        .gallery-grid {
            display: grid;

            justify-content: center;

        .gal-item {
            position: relative;

            background: linear-gradient(to top, rgba(0,0,0,.75), transparent);
        }
        .gal-soon { display: flex; align-items: center; justify-content: center; color: #999; font-size: 14px; text-align: center; padding: 40px 20px; grid-column: 1 / -1; }

        .lightbox {

        .lightbox img { max-width: 100%; max-height: 88vh; border-radius: 8px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
        .lightbox-close { position: absolute; top: 18px; right: 22px; background: none; border: none; color: #fff; font-size: 34px; cursor: pointer; line-height: 1; }

        footer { text-align: center; padding: 34px 20px; background: #1a1a1a; color: #ccc; margin-top: 20px; }

        }

<script>
const galleryPhotos = {
    tisselt: [
        { src: 'img/tisseltExt.jpg', key: 'capTisseltExt' },
        { src: 'img/pizza.jpg',      key: 'capPizza' },
        { src: 'img/pizzaParma.jpg', key: 'capParma' },
        { src: 'img/pizzaQuattroStagioni.jpg', key: 'capQuattroStagioni' },
        { src: 'img/sala.jpg',       key: 'capSala' },
        { src: 'img/finestre.jpg',   key: 'capFinestre' },
        { src: 'img/oblo.jpg',       key: 'capOblo' }
    ],
    wintam: [
        { src: 'img/wintamExt.jpg', key: 'capWintamExt' },
        { src: 'img/pizzaParma.jpg', key: 'capParma' },
        { src: 'img/pizzaQuattroStagioni.jpg', key: 'capQuattroStagioni' }
    ]
};

const translations = {
    it: {
        galTitle: 'Galleria', galSub: 'Scopri gli spazi e le creazioni di Arte Bianca',
        backToSite: 'Home', tisselt: 'Tisselt', wintam: 'Wintam',
        capTisseltExt: "Il nostro locale a Tisselt", capPizza: "Pizza Margherita", capParma: "Pizza Parma", capQuattroStagioni: "Pizza Quattro Stagioni", capSala: "La nostra sala",
        capFinestre: "Sala con vetrate", capOblo: "Il tavolo dell'oblò", capWintamExt: "Il nostro locale a Wintam",
        photosSoon: "Nuove foto in arrivo — seguici su Instagram!",
        home: 'Home', menu: 'Menù', catering: 'Asporto', reservation: 'Prenota', shop: 'Shop', about: 'Chi Siamo', gallery: 'Galleria', contact: 'Contatti'
    },
    en: {
        galTitle: 'Gallery', galSub: 'Discover the spaces and creations of Arte Bianca',
        backToSite: 'Home', tisselt: 'Tisselt', wintam: 'Wintam',
        capTisseltExt: "Our venue in Tisselt", capPizza: "Pizza Margherita", capParma: "Parma pizza", capQuattroStagioni: "Quattro Stagioni pizza", capSala: "Our dining room",
        capFinestre: "Dining room by the windows", capOblo: "The porthole table", capWintamExt: "Our venue in Wintam",
        photosSoon: "New photos coming soon — follow us on Instagram!",
        home: 'Home', menu: 'Menu', catering: 'Takeaway', reservation: 'Book', shop: 'Shop', about: 'About Us', gallery: 'Gallery', contact: 'Contact'
    },
    fr: {
        galTitle: 'Galerie', galSub: "Découvrez les espaces et créations d'Arte Bianca",
        backToSite: 'Accueil', tisselt: 'Tisselt', wintam: 'Wintam',
        capTisseltExt: "Notre établissement à Tisselt", capPizza: "Pizza Margherita", capParma: "Pizza Parma", capQuattroStagioni: "Pizza Quattro Stagioni", capSala: "Notre salle",
        capFinestre: "Salle avec baies vitrées", capOblo: "La table du hublot", capWintamExt: "Notre établissement à Wintam",
        photosSoon: "Nouvelles photos bientôt — suivez-nous sur Instagram !",
        home: 'Accueil', menu: 'Menu', catering: 'À emporter', reservation: 'Réserver', shop: 'Boutique', about: 'À propos', gallery: 'Galerie', contact: 'Contact'
    },
    nl: {
        galTitle: 'Galerij', galSub: 'Ontdek de ruimtes en creaties van Arte Bianca',
        backToSite: 'Home', tisselt: 'Tisselt', wintam: 'Wintam',
        capTisseltExt: "Onze zaak in Tisselt", capPizza: "Pizza Margherita", capParma: "Pizza Parma", capQuattroStagioni: "Pizza Quattro Stagioni", capSala: "Onze zaal",
        capFinestre: "Zaal met ramen", capOblo: "De tafel bij het rond raam", capWintamExt: "Onze zaak in Wintam",
        photosSoon: "Nieuwe foto's binnenkort — volg ons op Instagram!",
        home: 'Home', menu: 'Menu', catering: 'Afhalen', reservation: 'Reserveren', shop: 'Shop', about: 'Over ons', gallery: 'Galerij', contact: 'Contact'
    }
};
const LINGUE = { it: 'Italiano', nl: 'Nederlands', fr: 'Français', en: 'English' };

let currentLanguage = (function () {
    const p = new URLSearchParams(location.search).get('lang');
    if (p && translations[p]) {
        try { localStorage.setItem('abLang', p); } catch (e) {}
        return p;
    }
    let s = null;   // lingua scelta in precedenza sul sito
    try { s = localStorage.getItem('abLang'); } catch (e) {}
    if (s && translations[s]) return s;
    const n = (navigator.language || 'it').slice(0, 2);
    return translations[n] ? n : 'it';
})();

let currentTab = (new URLSearchParams(location.search).get('venue') === 'wintam') ? 'wintam' : 'tisselt';

function t(k) { return (translations[currentLanguage] && translations[currentLanguage][k]) || k; }

function setTab(loc) {
    currentTab = loc;
    render();
}

function renderGrid() {
    const list = galleryPhotos[currentTab] || [];
    const grid = document.getElementById('galleryGrid');
    if (!list.length) {
        grid.innerHTML = '<div class="gal-item gal-soon" style="aspect-ratio:auto;background:none;">' + t('photosSoon') + '</div>';
        return;
    }
    grid.innerHTML = list.map(function (p, i) {
        return '<div class="gal-item" onclick="openLightbox(' + i + ')">' +
                '<img src="' + p.src + '" alt="' + t(p.key) + '" loading="lazy" onerror="this.parentNode.classList.add(\'gal-broken\');this.remove();">' +
                '<span>' + t(p.key) + '</span>' +
            '</div>';
    }).join('');
}

function openLightbox(i) {
    const p = galleryPhotos[currentTab][i];
    if (!p) return;
    document.getElementById('lightboxImg').src = p.src;
    document.getElementById('lightboxImg').alt = t(p.key);
    document.getElementById('lightbox').classList.add('show');
}
function closeLightbox() { document.getElementById('lightbox').classList.remove('show'); }

function render() {
    document.documentElement.lang = currentLanguage;
    document.getElementById('galTitle').textContent = t('galTitle');
    document.getElementById('galSub').textContent = t('galSub');
    document.getElementById('bcHome').textContent = t('backToSite');
    document.getElementById('bcCurrent').textContent = t('galTitle');
    document.getElementById('tabTisseltLabel').textContent = t('tisselt');
    document.getElementById('tabWintamLabel').textContent = t('wintam');

    document.getElementById('tabTisselt').classList.toggle('active', currentTab === 'tisselt');
    document.getElementById('tabWintam').classList.toggle('active', currentTab === 'wintam');

    document.getElementById('langRow').innerHTML = Object.keys(LINGUE).map(function (l) {
        const params = new URLSearchParams(location.search);
        params.set('lang', l);
        return '<a href="?' + params.toString() + '"' + (l === currentLanguage ? ' class="on"' : '') + '>' + LINGUE[l] + '</a>';
    }).join('');

    renderSiteNav();
    renderGrid();
}

function renderSiteNav() {
    const items = [
        { id: 'home', label: t('home') },
        { id: 'menu', label: t('menu') },
        { id: 'catering', label: t('catering') },
        { id: 'reservation', label: t('reservation') },
        { id: 'shop', label: t('shop') },
        { id: 'about', label: t('about') },
        { id: 'gallery', label: t('gallery') }
    ];
    const links = items.map(function (item) {
        const href = '../index.html?lang=' + currentLanguage + '&venue=' + currentTab + '&goto=' + item.id;
        return '<a href="' + href + '">' + item.label + '</a>';
    }).join('');
    const siteNav = document.getElementById('siteNav');
    const mobileNav = document.getElementById('mobileNav');
    if (siteNav) siteNav.innerHTML = links;
    if (mobileNav) mobileNav.innerHTML = links;
}

function toggleSiteMenu() {
    const nav = document.getElementById('mobileNav');
    if (nav) nav.classList.toggle('active');
}

function closeSiteMenu() {
    const nav = document.getElementById('mobileNav');
    if (nav) nav.classList.remove('active');
}

window.addEventListener('scroll', function () {
    const b = document.getElementById('toTopBtn');
    if (b) b.classList.toggle('show', window.scrollY > 400);
});

render();
</script>

<!-- COOKIE BANNER -->
<div id="cookieBanner" style="display:none;position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#1a1a1a;color:#fff;padding:16px 20px;box-shadow:0 -3px 14px rgba(0,0,0,.25);font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;">
    <div style="max-width:960px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:14px;justify-content:space-between;">
        <p id="cookieText" style="margin:0;font-size:13px;line-height:1.5;flex:1;min-width:220px;color:#e5e5e5;"></p>
        <div style="display:flex;gap:10px;flex-shrink:0;">
            <button id="cookieReject" style="padding:9px 18px;border-radius:6px;border:1px solid #666;background:transparent;color:#fff;font-weight:600;cursor:pointer;font-size:13px;font-family:inherit;"></button>
            <button id="cookieAccept" style="padding:9px 20px;border-radius:6px;border:none;background:#ca8a04;color:#fff;font-weight:600;cursor:pointer;font-size:13px;font-family:inherit;"></button>
        </div>
    </div>
</div>
<script>
(function () {
    var COOKIE_TXT = {
        it: { text: "Utilizziamo cookie di analisi (Google Analytics) per migliorare il sito. Puoi accettarli o rifiutarli in qualsiasi momento.", accept: "Accetta", reject: "Rifiuta" },
        en: { text: "We use analytics cookies (Google Analytics) to improve the site. You can accept or reject them at any time.", accept: "Accept", reject: "Reject" },
        fr: { text: "Nous utilisons des cookies d'analyse (Google Analytics) pour améliorer le site. Vous pouvez les accepter ou les refuser à tout moment.", accept: "Accepter", reject: "Refuser" },
        nl: { text: "We gebruiken analytische cookies (Google Analytics) om de site te verbeteren. U kunt ze op elk moment accepteren of weigeren.", accept: "Accepteren", reject: "Weigeren" }
    };
    var lang = (typeof currentLanguage !== 'undefined' && COOKIE_TXT[currentLanguage]) ? currentLanguage : ((navigator.language || 'it').slice(0, 2));
    if (!COOKIE_TXT[lang]) lang = 'it';
    var txt = COOKIE_TXT[lang];

    var banner = document.getElementById('cookieBanner');
    var textEl = document.getElementById('cookieText');
    var acceptBtn = document.getElementById('cookieAccept');
    var rejectBtn = document.getElementById('cookieReject');
    if (textEl) textEl.textContent = txt.text;
    if (acceptBtn) acceptBtn.textContent = txt.accept;
    if (rejectBtn) rejectBtn.textContent = txt.reject;

    var consent = localStorage.getItem('cookieConsent');
    if (consent === 'accepted') {
        if (window.loadGoogleAnalytics) window.loadGoogleAnalytics();
    } else if (consent !== 'rejected') {
        if (banner) banner.style.display = 'block';
    }

    if (acceptBtn) acceptBtn.addEventListener('click', function () {
        localStorage.setItem('cookieConsent', 'accepted');
        if (banner) banner.style.display = 'none';
        if (window.loadGoogleAnalytics) window.loadGoogleAnalytics();
    });
    if (rejectBtn) rejectBtn.addEventListener('click', function () {
        localStorage.setItem('cookieConsent', 'rejected');
        if (banner) banner.style.display = 'none';
    });
})();
</script>
