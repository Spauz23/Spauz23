<!-- Hero video: seamless 25s loop. Vertical file on phones, 720p elsewhere -->
<section class="hero-video">
  <video id="heroVideo" autoplay muted loop playsinline preload="auto" poster="video/poster.jpg"></video>
  <script>
    (function () {
      var v = document.getElementById('heroVideo');
      var f = window.matchMedia('(max-aspect-ratio: 1/1)').matches ? 'mobile' : '720p';
      v.innerHTML = '<source src="video/italia_loop_' + f + '.webm" type="video/webm">' +
                    '<source src="video/italia_loop_' + f + '.mp4" type="video/mp4">';
      v.load();
    })();
  </script>
</section>
<style>
  .hero-video { position: relative; height: 100vh; overflow: hidden; background: #1a0f08; }
  .hero-video video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  @media (prefers-reduced-motion: reduce) { .hero-video video { display: none; } .hero-video { background: #1a0f08 url(video/poster.jpg) center/cover; } }
</style>
